name: Publish package to PyPI
on:
  push:
    tags:
    - 'v*'
jobs:
  build-n-publish:
    name: Build and publish package to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build
        run: uv build

      - name: Publish
        env:
          PYPI_TOKEN: ${{ secrets.pypi_password }}
        run: uv publish --token $PYPI_TOKEN

  notify-portal:
    name: Tell pyobs-portal about the new release
    needs: build-n-publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to pyobs-portal
        env:
          GH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          gh api repos/pyobs/pyobs-portal/dispatches \
            -f event_type=pyobs-core-release \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"
