hosts:
  - "localhost"

loglevel: warning

# Plain TCP only — no TLS needed for testing
listen:
  - port: 5222
    ip: "::"
    module: ejabberd_c2s
    starttls: false

auth_method:
  - internal

acl:
  local:
    user_regexp: ""
  benchmark_clients:
    user:
      - "camera@localhost"
      - "observer@localhost"

access_rules:
  local:
    allow: local
  pubsub_createnode:
    allow: local
  announce:
    allow: admins

# Same rate values as the default shaper (tests/xmpp/ejabberd.yml) — only the c2s
# shaper_rules assignment differs: benchmark accounts get the "fast" shaper
# (100000 B/s, no burst cap in this config) instead of "normal" (3000 B/s / 20000 B
# burst). Third leg of the shaper comparison, alongside the default and 10x-rate
# configs — see specs/plans/ejabberd-throughput-benchmarking.md. Tests whether
# simply exempting benchmark clients from the throttled c2s shaper track (as a
# production deployment might, e.g. via ACL) removes the concurrent-vs-sequential
# slowdown, independent of the 10x-rate question.
shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  c2s_shaper:
    none: admin
    fast: benchmark_clients
    normal: all
  s2s_shaper: fast

modules:
  mod_admin_extra: {}
  mod_caps: {}
  mod_disco: {}
  mod_ping: {}
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins:
      - flat
    default_node_config:
      # Keep only the latest value — state has no history
      max_items: 1
      persist_items: true
      deliver_payloads: true
      deliver_notifications: true
      # Hand the current value to a new subscriber immediately on subscribe
      send_last_published_item: on_sub_and_presence
      notify_retract: false
  mod_roster: {}
  mod_shared_roster: {}
  mod_vcard: {}
